plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'jacoco'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()
    runs {
        client {
            // Keep offline UUIDs stable across restarts. This identity owns the recovered World 5
            // survival inventory; use -PdevUsername=AnotherName for an independent character.
            programArgs '--username', providers.gradleProperty('devUsername').getOrElse('Player451')
            if (providers.gradleProperty('devWorld').isPresent()) {
                programArgs '--quickPlaySingleplayer', providers.gradleProperty('devWorld').get()
            }
            if (providers.gradleProperty('devCreateWorld').isPresent()) {
                vmArg '-Dnullspace.dev.createWorld=' + providers.gradleProperty('devCreateWorld').get()
                vmArg '-Dnullspace.dev.startShip=' + providers.gradleProperty('devStartingShip').getOrElse('halcyon_horizon')
            }
        }
        playtest {
            client()
            programArgs '--username', providers.gradleProperty('devUsername').getOrElse('Player451')
            name 'NullSpace prepared test world'
            vmArg '-Dnullspace.playtest=true'
            runDir 'run'
        }
        shipLab {
            client()
            programArgs '--username', providers.gradleProperty('devUsername').getOrElse('Player451')
            name 'NullSpace walking ship test gallery'
            vmArg '-Dnullspace.playtest=true'
            vmArg '-Dnullspace.lab=true'
            runDir 'run-lab'
        }
    }
    mods {
        nullspace {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

fabricApi {
    configureTests {
        createSourceSet = true
        modId = 'nullspace-test'
        enableGameTests = true
        enableClientGameTests = true
        eula = true
    }
}

processResources {
    def modVersion = project.version.toString()
    inputs.property 'version', modVersion
    filesMatching('fabric.mod.json') {
        expand version: modVersion
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

tasks.withType(Jar).configureEach {
    from('LICENSE') { into 'META-INF' }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    // Instrument only when requested; normal game and test launches keep their usual cost.
    jacoco {
        enabled = providers.gradleProperty('coverage').getOrElse('false').toBoolean()
        includes = ['com.nullandkale.nullspace.*']
    }
}

jacoco {
    toolVersion = '0.8.16'
}

tasks.named('jacocoTestReport') {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.register('exportCoverageAgent', Copy) {
    from { zipTree(configurations.jacocoAgent.singleFile) }
    include 'jacocoagent.jar'
    into layout.buildDirectory.dir('coverage-agent')
}

tasks.register('combinedCoverageReport', org.gradle.testing.jacoco.tasks.JacocoReport) {
    sourceSets sourceSets.main
    executionData layout.buildDirectory.file('jacoco/test.exec')
    def runDirectory = providers.gradleProperty('coverageRun')
    if (runDirectory.isPresent()) {
        executionData fileTree(runDirectory.get()) { include '**/coverage.exec' }
    }
    reports {
        xml.required = true
        html.required = true
    }
}

if (providers.gradleProperty('coverage').getOrElse('false').toBoolean()) {
    tasks.named('test') { finalizedBy jacocoTestReport }
}

// Opt-in pure systems benchmark; never starts Minecraft or opens player worlds.
tasks.register('benchmarkSystems', JavaExec) {
    dependsOn 'testClasses'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.nullandkale.nullspace.systems.AtmosphereBenchmark'
    args layout.buildDirectory.dir('performance').get().asFile.absolutePath,
        providers.gradleProperty('benchmarkLabel').getOrElse('current')
}


// Interactive local multiplayer uses ordinary launches, without GameTest entrypoints.
tasks.register('exportLocalPlayLaunches') {
    notCompatibleWithConfigurationCache('Exports ordinary development JVM launches for local play')
    dependsOn 'classes', 'clientClasses', 'configureClientLaunch', 'configureLaunch', 'generateDLIConfig', 'downloadAssets'
    doLast {
        ['client': 'runClient', 'server': 'runServer'].each { kind, taskName ->
            def launch = tasks.named(taskName).get()
            layout.buildDirectory.file("local-play-${kind}-launch.json").get().asFile.text =
                groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                    executable: launch.javaLauncher.get().executablePath.asFile.absolutePath,
                    jvmArgs: launch.allJvmArgs, classpath: launch.classpath.asPath,
                    mainClass: launch.mainClass.get(), args: launch.args
                ]))
        }
    }
}

// Explicitly invoked local verification only; never added to build/check or CI.
tasks.register('exportLocalClientLaunch') {
    notCompatibleWithConfigurationCache('Exports the configured JavaExec launch for opt-in local verification')
    dependsOn 'compileGametestJava', 'processGametestResources', 'configureClientLaunch', 'configureLaunch', 'generateDLIConfig', 'downloadAssets'
    doLast {
        def launch = tasks.named('runClientGameTest').get()
        def output = layout.buildDirectory.file('local-client-launch.json').get().asFile
        output.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            executable: launch.javaLauncher.get().executablePath.asFile.absolutePath,
            jvmArgs: launch.allJvmArgs,
            classpath: launch.classpath.asPath,
            mainClass: launch.mainClass.get(),
            args: launch.args
        ]))
    }
}

tasks.register('exportLocalServerLaunch') {
    notCompatibleWithConfigurationCache('Exports the configured JavaExec launch for opt-in local verification')
    dependsOn 'compileGametestJava', 'processGametestResources', 'configureLaunch', 'generateDLIConfig', 'acceptGameTestEula'
    doLast {
        def launch = tasks.named('runGameTest').get()
        layout.buildDirectory.file('local-server-launch.json').get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            executable: launch.javaLauncher.get().executablePath.asFile.absolutePath,
            jvmArgs: launch.allJvmArgs, classpath: launch.classpath.asPath,
            mainClass: launch.mainClass.get(), args: launch.args
        ]))
    }
}

// Each server-test run owns a fresh disposable world. Reusing the old world
// accumulates completed transfer journals and makes recovery tests scan many
// unrelated fixture snapshots on every iteration. Never touch player saves.
def serverTestSessions = layout.buildDirectory.dir('run/gameTest-sessions')
if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
    tasks.register('pruneGameTestWorlds', Exec) {
        commandLine 'powershell.exe', '-NoProfile', '-NonInteractive', '-File',
            layout.projectDirectory.file('scripts/Remove-OldGameTestWorlds.ps1').asFile.absolutePath
    }
    tasks.named('runGameTest').configure { dependsOn 'pruneGameTestWorlds' }
    tasks.register('cleanupGameTestWorlds', Exec) {
        commandLine 'powershell.exe', '-NoProfile', '-NonInteractive', '-File',
            layout.projectDirectory.file('scripts/Remove-OldGameTestWorlds.ps1').asFile.absolutePath
    }
    tasks.register('cleanupClientGameTestWorlds', Exec) {
        commandLine 'powershell.exe', '-NoProfile', '-NonInteractive', '-File',
            layout.projectDirectory.file('scripts/Remove-TestWorlds.ps1').asFile.absolutePath,
            '-WorkRoot', layout.buildDirectory.dir('run/clientGameTest').get().asFile.absolutePath
    }
    // Finalizers also run when a test JVM fails. Logs, XML and screenshots stay.
    tasks.named('runGameTest').configure { finalizedBy 'cleanupGameTestWorlds' }
    tasks.named('runClientGameTest').configure { finalizedBy 'cleanupClientGameTestWorlds' }
}
tasks.named('runGameTest', JavaExec).configure {
    def sessionsDirectory = serverTestSessions
    doFirst {
        def testDirectory = new File(sessionsDirectory.get().asFile, UUID.randomUUID().toString())
        testDirectory.mkdirs()
        // Use Minecraft's public world-root option; Loom owns the process cwd.
        args '--universe', testDirectory.absolutePath
    }
}

apply from: 'gradle/content-assets.gradle'
