<title id="title">Tiny ship and station floor plans — discussion draft</title>
<desc id="description">A proposed two-room nine-by-fifteen-block tiny ship, and a growing station route concept with an arrival room, service hub, greenhouse bays, stores and engineering. These are unapproved design sketches.</desc>
