name: Release

# Builds, runs the full test suite and publishes a GitHub release when a version tag is pushed.
# The native server tests are split into four jobs that run side by side (-PgametestShard=N/4, see build.gradle); the unit tests,
# asset check and JAR build run in a fifth; the release is published only when all five pass.
#   vN.N.N             full release, marked Latest (N.N.N must equal mod_version)
#   vN.N.N_<anything>  prerelease, for example v0.1.0_rc1 (N.N.N must equal mod_version)
# A tag moved to a new commit replaces its release (same version, new JAR and notes). See docs/release/release-policy.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (for example v0.1.0 or v0.1.0_rc1)
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  native:
    name: native tests ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Run this slice of the native tests with bounded diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci-diagnostics
          # Snapshot every JVM every 4 minutes so a stall shows where the server thread sits over time.
          (
            n=0
            while sleep 240; do
              n=$((n + 1))
              for pid in $(jps -q); do
                jcmd "$pid" Thread.print > "build/ci-diagnostics/threads-$pid-$n.txt" 2>/dev/null || true
                jcmd "$pid" GC.heap_info > "build/ci-diagnostics/heap-$pid-$n.txt" 2>/dev/null || true
                echo "== snapshot $n pid $pid"
                sed -n '/^"Server thread"/,/^$/p' "build/ci-diagnostics/threads-$pid-$n.txt" | head -12
              done
            done
          ) &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          timeout --signal=QUIT --kill-after=30s 40m ./gradlew runGameTest -PgametestShard=${{ matrix.shard }}/4 --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-reports-${{ matrix.shard }}
          retention-days: 14
          path: |
            build/run/**/logs/
            build/ci-diagnostics/

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      kind: ${{ steps.classify.outputs.kind }}
      label: ${{ steps.classify.outputs.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew

      - name: Classify the tag
        id: classify
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          if [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then kind=full
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)_.+$ ]]; then kind=prerelease
          else echo "::error::Tag $TAG is not vN.N.N or vN.N.N_<label>"; exit 1; fi
          [ "${BASH_REMATCH[1]}" = "$version" ] || {
            echo "::error::Tag $TAG is for ${BASH_REMATCH[1]} but mod_version is $version"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG exists; it is replaced when the tests pass."
          fi
          { echo "VERSION=$version"; echo "KIND=$kind"; echo "LABEL=${TAG#v}"; } >> "$GITHUB_ENV"
          { echo "kind=$kind"; echo "label=${TAG#v}"; } >> "$GITHUB_OUTPUT"
          echo "Release kind: $kind"

      - name: Build with the unit tests and the asset check (the native tests run in their own jobs)
        run: timeout --signal=QUIT --kill-after=30s 25m ./gradlew build verifyContentAssets -x runGameTest --no-daemon

      - name: Inspect the release JAR
        run: |
          jar="build/libs/nullspace-${VERSION}.jar"
          test -f "$jar" || { echo "::error::Missing $jar"; exit 1; }
          meta=$(unzip -p "$jar" fabric.mod.json)
          [ "$(echo "$meta" | jq -r .id)" = nullspace ] || { echo "::error::Wrong mod id"; exit 1; }
          [ "$(echo "$meta" | jq -r .version)" = "$VERSION" ] || { echo "::error::JAR version differs from mod_version"; exit 1; }
          if echo "$meta" | jq -e '.entrypoints | has("fabric-gametest") or has("gametest")' >/dev/null; then
            echo "::error::Release JAR contains GameTest entrypoints"; exit 1
          fi
          if unzip -Z1 "$jar" | grep -Eq '(^|/)(gametest|test-results)/'; then
            echo "::error::Release JAR contains test output"; exit 1
          fi
          # Name the asset after the tag so prereleases of the same version stay distinguishable.
          mkdir -p dist
          cp "$jar" "dist/nullspace-${LABEL}.jar"
          (cd dist && sha256sum "nullspace-${LABEL}.jar" > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: License notice
        run: |
          if [ ! -f LICENSE ]; then
            echo "::warning::No LICENSE file in this commit. The release is public without stated distribution terms."
            echo "### No LICENSE in this commit" >> "$GITHUB_STEP_SUMMARY"
            echo "See docs/release/release-license-proposal.md." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          retention-days: 7
          path: dist/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          retention-days: 14
          path: |
            build/reports/
            build/test-results/

  publish:
    needs: [native, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      KIND: ${{ needs.build.outputs.kind }}
      LABEL: ${{ needs.build.outputs.label }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish the release
        run: |
          (cd dist && sha256sum -c SHA256SUMS.txt)
          notes="Alpha build for Minecraft 26.3 with Fabric Loader 0.19.5 and Fabric API 0.164.0+26.3. Install on both client and server. Verify the download against SHA256SUMS.txt."
          # A moved tag replaces its release; the tag itself stays where it was pushed.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes
            echo "Replaced the previous $TAG release." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$KIND" = full ]; then
            gh release create "$TAG" dist/* --verify-tag --latest --title "NullSpace $LABEL" --generate-notes --notes "$notes"
          else
            gh release create "$TAG" dist/* --verify-tag --prerelease --latest=false --title "NullSpace $LABEL (prerelease)" \
              --generate-notes --notes "$notes"
          fi
          echo "Published $KIND release: $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
