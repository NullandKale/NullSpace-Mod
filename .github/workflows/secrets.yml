name: Secret scan

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  release-policy:
    name: Release promotion guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject mismatched or stale deployments without publishing
        shell: pwsh
        run: ./scripts/Test-ReleasePromotion.ps1
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan complete Git history with redacted output
        shell: bash
        run: |
          set -euo pipefail
          directory="$RUNNER_TEMP/nullspace-gitleaks"
          mkdir -p "$directory"
          archive="$directory/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$directory"
          "$directory/gitleaks" git . --log-opts=--all --redact=100 --no-banner --config .gitleaks.toml
