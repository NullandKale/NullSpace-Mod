name: Build and test

on: [push, pull_request, workflow_dispatch]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - name: Build and test with bounded diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/ci-diagnostics
          (
            sleep 180
            for pid in $(jps -q); do
              jcmd "$pid" Thread.print > "build/ci-diagnostics/threads-$pid.txt" 2>/dev/null || true
              jcmd "$pid" GC.heap_info > "build/ci-diagnostics/heap-$pid.txt" 2>/dev/null || true
              sed -n '/^"Server thread"/,/^$/p' "build/ci-diagnostics/threads-$pid.txt"
            done
          ) &
          monitor=$!
          trap 'kill "$monitor" 2>/dev/null || true' EXIT
          timeout --signal=QUIT --kill-after=30s 20m ./gradlew build verifyContentAssets -Pcoverage=true --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: nullspace
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          retention-days: 14
          path: |
            build/reports/
            build/test-results/
            build/run/**/logs/
            build/ci-diagnostics/

